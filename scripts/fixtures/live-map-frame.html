<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Development mock Live Map sender</title>
<style>*{box-sizing:border-box}html,body{margin:0;height:100%;font:14px Arial;color:#173644}body{display:flex;flex-direction:column;background:#eaf3ee}header{padding:8px;background:#fff4ce;display:flex;flex-wrap:wrap;gap:8px;align-items:center}select,button{font:inherit;min-height:40px;max-width:100%;border:1px solid #b7c9c0;border-radius:8px;background:white;padding:6px 10px;color:#173644}button:focus-visible,select:focus-visible{outline:3px solid #b91546;outline-offset:2px}main{position:relative;flex:1;min-height:0;overflow:hidden;background:linear-gradient(135deg,#c4e7ef 35%,#d7e9d1 36%,#f0f4df 80%)}.road{position:absolute;inset:15% 10%;border:5px dashed #cfa82c;border-radius:45%;transform:rotate(-12deg)}img{position:absolute;left:35%;top:35%;width:80px}.stops{display:flex;justify-content:space-between;padding:18px;position:relative}.stops span{background:#fff;border:2px solid #b91546;border-radius:50%;padding:8px 12px}#internal{position:relative;background:#fff;margin:12px;padding:12px;border-radius:10px}#toolbar{position:absolute;bottom:0;left:0;right:0;display:flex;justify-content:center;gap:4px;padding:8px 4px max(8px,env(safe-area-inset-bottom));background:#fff;border-top:1px solid #aaa}#toolbar button{flex:1;max-width:110px;min-width:0;padding-inline:3px}#notice{position:absolute;bottom:72px;background:#fff;margin:4px;padding:6px;font-size:12px}#details{display:none;background:white;position:absolute;inset:10px 10px 80px;padding:12px;overflow:auto}body[data-external] #internal{display:none}</style>
<header><strong>Mock iframe · no live tracking</strong><label>State <select id="state"><option>parked</option><option>moving</option><option>unknown</option><option>out-of-service</option><option>error</option><option>loading</option><option>stale</option><option>long-labels</option><option>malformed</option><option>unauthorized</option></select></label></header>
<main aria-label="Schematic fixture canvas, not the real map"><div class="road"></div><div id="internal">Mock internal status (default mode only)</div><div class="stops" aria-hidden="true"><span>1</span><span>2</span><span>3</span><span>4</span><span>5</span></div><img src="/van.svg" alt="Original website van graphic in schematic fixture"><div id="details">Fixture stop list: Start/Stop, Shiroka, Castle, Cathedral, Bridge. <button id="close">Close stops</button></div><output id="notice" aria-live="polite">Controls simulate responses only.</output><nav id="toolbar" aria-label="Mock iframe toolbar"><button id="find">Find me</button><button id="van">Find van</button><button id="route">Route</button><button id="stops">Stops</button></nav></main>
<script>
const params=new URLSearchParams(location.search),allowed=new Set(['http://localhost:3011','http://127.0.0.1:3011']);
const menu=document.getElementById('state'),notice=document.getElementById('notice');menu.value=params.get('state')||'parked';
let parentOrigin=null,timer,active=false;
const names=['Start/Stop','Shiroka / Lake Shkodra','Rozafa Castle',"St Stephen’s Cathedral",'Mesi Bridge'];
function snapshot(state){const known=['parked','moving','stale','long-labels'].includes(state),now=Date.now();const phase=state==='moving'?'EN_ROUTE':known?'PARKED':'UNKNOWN';return {type:'shkodra:journey',version:1,unavailable:!known,phase,movement:state==='moving'?'On the way to Rozafa Castle':known?'Parked at Shiroka':'Location not confirmed',lastObservationAt:new Date(now).toISOString(),statusValidUntil:new Date(now+(state==='stale'?3000:30000)).toISOString(),confidence:{position:state==='moving'?'live':'unavailable'},stops:names.map((label,i)=>({id:String(i+1),number:String(i+1),label,state:known?(i===1?'current':i===2?'next':'upcoming'):'upcoming',eta:''})),embeddedDisplay:{version:1,label:state==='moving'?'ON THE WAY':known?'PARKED AT':'STATUS',destination:state==='out-of-service'?'Service finished for today':state==='error'?'Location temporarily unavailable':state==='unknown'?'Location not confirmed':state==='long-labels'?'A very long translated destination name for responsive wrapping in a narrow website container':state==='moving'?'Rozafa Castle':'Shiroka / Lake Shkodra',activity:known?'Departure not confirmed':'',eta:state==='moving'?'ETA about 12 min':known?'About 12 min after departure':'',nextStop:known?'Rozafa Castle':'',live:state==='moving',stops:names.map((name,i)=>({id:String(i+1),number:String(i+1),name,label:known?(i===1?'Current stop':'Upcoming stop'):'Unknown',state:known?(i===0?'completed':i===1?'current':i===2?'next':'upcoming'):'unknown'}))}};}
function send(){if(!active||!parentOrigin||menu.value==='loading')return;const state=menu.value;if(state==='unauthorized'){const f=document.createElement('iframe');f.hidden=true;f.src='http://127.0.0.1:4200/unauthorized?parentOrigin='+encodeURIComponent(parentOrigin);document.body.append(f);notice.textContent='Unauthorized origin/source sent; parent must ignore it.';return;}const data=snapshot(state);if(state==='malformed')data.embeddedDisplay.version=99;parent.postMessage(data,parentOrigin);notice.textContent='Fixture sent: '+state;}
function start(){clearInterval(timer);send();if(!['stale','loading','unauthorized','malformed'].includes(menu.value))timer=setInterval(send,10000);}
window.addEventListener('message',e=>{if(e.source!==parent||!allowed.has(e.origin)||e.data?.type!=='shkodra:request-journey'||e.data.version!==1)return;if(params.get('embed')!=='1'||params.get('websiteStatus')!=='external-v1'||e.data.embeddedDisplayVersion!==1||parent===window)return;parentOrigin=e.origin;document.body.dataset.external='true';if(!active){active=true;start();}else if(menu.value!=='stale')send();});
menu.addEventListener('change',()=>{if(menu.value==='loading'){const u=new URL(location.href);u.searchParams.set('state','loading');location.replace(u);return;}start();});
for(const id of ['find','van','route'])document.getElementById(id).onclick=()=>notice.textContent='Fixture '+id+': no geolocation, route processing or tracking requested.';
document.getElementById('stops').onclick=()=>document.getElementById('details').style.display='block';document.getElementById('close').onclick=()=>document.getElementById('details').style.display='none';
window.addEventListener('message',e=>{if(e.source===parent&&e.origin===parentOrigin&&e.data?.type==='shkodra:select-stop'&&e.data.version===1)notice.textContent='Selected fixture stop '+e.data.id;});
</script></html>
