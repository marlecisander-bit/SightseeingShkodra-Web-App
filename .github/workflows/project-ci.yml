name: Project CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: project-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify project
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CI: 'true'
      NEXT_TELEMETRY_DISABLED: '1'
      APP_ENV: development
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      BACKGROUND_DELIVERY_ENABLED: 'false'
      EMAIL_ENABLED: 'false'
      ADMIN_NOTIFICATIONS_ENABLED: 'false'
      ADMIN_PUSH_ENABLED: 'false'
      SITE_INDEXING_ENABLED: 'false'
      ALLOW_ISOLATED_DEVELOPMENT_MUTATIONS: 'false'
    steps:
      - name: Check out source
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - name: Set up supported Node.js
        uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version-file: package.json
          package-manager-cache: false
      - name: Install locked dependencies
        run: npm ci
      - name: Lint, types and production build
        run: npm run check
      - name: Automated disposable database tests
        run: npm test
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=low
